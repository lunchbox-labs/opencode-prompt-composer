name: Release
# Run by hand on main. The run releases the version that packages/opencode and
# packages/kilo share: it refuses a version that already has a tag or either
# package on npm, runs Check on the release commit, publishes the verified
# tarballs to npm (OpenCode first), then creates the v<version> tag and a
# published GitHub release with the tarballs attached. packages/core is
# private and bundled into both, so it is never packed or published.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check the release, then stop before npm, the tag and the GitHub release
        type: boolean
        default: false
      prerelease:
        description: Publish under npm's next tag and mark the GitHub release as a pre-release
        type: boolean
        default: false

permissions:
  contents: read

# Run every step as bash with pipefail, as the tests do.
defaults:
  run:
    shell: bash

# Keep this group apart from the called Check's, which is
# "${{ github.workflow }}-<ref>" and so "Release-refs/heads/main" here: a
# shared group would make the called Check wait for this run forever.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Release version
    if: >-
      github.repository == 'lunchbox-labs/opencode-prompt-composer' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job's summary shows on the run page once the job ends, so this short
    # job names the version within seconds of the run starting.
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require a run on main
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          if [ "$RUN_REF" != refs/heads/main ]; then
            echo "::error::Run Release on main. This run was started on $RUN_REF."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the release version
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          # The two packages release together, so they must share one version.
          versions="$(jq -r .version packages/opencode/package.json packages/kilo/package.json | sort -u)"
          if [ "$(wc -l <<<"$versions")" -ne 1 ]; then
            echo "::error::packages/opencode and packages/kilo must hold the same version."
            exit 1
          fi
          version="$versions"
          core='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          if [ "$PRERELEASE" = true ]; then
            if [[ ! "$version" =~ ^$core-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$ ]]; then
              echo "::error::A pre-release needs a pre-release version in the package manifests, such as 1.2.3-beta.1."
              exit 1
            fi
            kind=pre-release
          elif [[ ! "$version" =~ ^$core$ ]]; then
            echo "::error::The package manifests must hold a stable version such as 1.2.3. To publish a pre-release version, run Release with prerelease set."
            exit 1
          else
            kind=release
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing v$version from $RELEASE_COMMIT."
          {
            echo "### Release v$version"
            echo
            echo "Commit \`$RELEASE_COMMIT\` on \`main\`, as a $kind."
            if [ "$DRY_RUN" = true ]; then
              echo
              echo "Dry run: the run builds and checks this version, then stops before npm, the tag and the GitHub release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify
    needs: [version]
    if: >-
      github.repository == 'lunchbox-labs/opencode-prompt-composer' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      access: ${{ steps.release.outputs.access }}
      packages: ${{ steps.release.outputs.packages }}
      tag: ${{ needs.version.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Keep provenance aligned with the triggering commit
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$WORKFLOW_COMMIT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate release metadata
        id: release
        env:
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: node scripts/validate-release.mjs
      # npm adds a trusted publisher only to a package that exists, so a
      # package name that was never published would fail Publish npm after
      # the packages before it had been published.
      - name: Require every package to exist on npm
        env:
          NPM_PACKAGES: ${{ steps.release.outputs.packages }}
        run: |
          missing=""
          for package in $NPM_PACKAGES; do
            if ! npm view "$package" name > /dev/null 2>"$RUNNER_TEMP/npm-name.log"; then
              if grep -q "code E404" "$RUNNER_TEMP/npm-name.log"; then
                missing="$missing $package"
              else
                cat "$RUNNER_TEMP/npm-name.log" >&2
                exit 1
              fi
            fi
          done
          if [ -n "$missing" ]; then
            for package in $missing; do
              echo "::error::$package is not on npm. Publish a bootstrap pre-release of it and add its trusted publisher, as the Publishing wiki page describes, then run Release again."
            done
            exit 1
          fi
      - name: Refuse a version that is already released
        env:
          NPM_PACKAGES: ${{ steps.release.outputs.packages }}
          NPM_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Tag $RELEASE_TAG already exists. To finish an earlier run of this version, re-run only its failed jobs. Otherwise bump the version in the package manifests, merge it to main and run Release again."
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo "::error::Could not check whether tag $RELEASE_TAG exists."
            exit 1
          fi
          for package in $NPM_PACKAGES; do
            if published="$(npm view "$package@$NPM_VERSION" version 2>"$RUNNER_TEMP/npm-view.log")"; then
              if [ -n "$published" ]; then
                echo "::error::$package@$NPM_VERSION is already on npm. To finish an earlier run of this version, re-run only its failed jobs. Otherwise bump the version in the package manifests, merge it to main and run Release again."
                exit 1
              fi
            elif ! grep -q "code E404" "$RUNNER_TEMP/npm-view.log"; then
              cat "$RUNNER_TEMP/npm-view.log" >&2
              exit 1
            fi
          done
      - name: Install dependencies
        run: npm ci
      # Builds each package's dist/ and tests the packed packages. The full
      # checks run in the Check job against the same commit.
      - name: Run package tests
        run: npm run test:package
      - name: Pack the verified build
        run: |
          mkdir release
          npm pack --workspace packages/opencode --workspace packages/kilo --ignore-scripts --pack-destination release
          cd release
          sha256sum ./*.tgz > SHA256SUMS
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 3

  check:
    name: Check
    # Runs after Verify, so a refused version ends the run without running
    # every check.
    needs: [verify]
    if: >-
      github.repository == 'lunchbox-labs/opencode-prompt-composer' &&
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  publish:
    name: Publish npm
    needs: [verify, check]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use a trusted-publishing-capable npm version
        # Kept exact: this job can publish with an OIDC token.
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - name: Publish the verified tarballs with OIDC
        working-directory: release
        env:
          NPM_ACCESS: ${{ needs.verify.outputs.access }}
          # In publication order: OpenCode, then Kilo.
          NPM_PACKAGES: ${{ needs.verify.outputs.packages }}
          NPM_TAG: ${{ inputs.prerelease && 'next' || 'latest' }}
          NPM_VERSION: ${{ needs.verify.outputs.version }}
          # This repository and its npm packages are public.
          NPM_CONFIG_PROVENANCE: "true"
        # Re-running this job after a partial or successful publication skips
        # each package npm already holds with this exact tarball, and stops at
        # one it holds with another.
        run: |
          sha256sum --check SHA256SUMS
          for package in $NPM_PACKAGES; do
            # npm pack names @scope/name as scope-name-<version>.tgz.
            file="./$(tr -d @ <<<"$package" | tr / -)-$NPM_VERSION.tgz"
            if [ ! -f "$file" ]; then
              echo "::error::The verified build has no tarball for $package@$NPM_VERSION."
              exit 1
            fi
            tarball="sha512-$(openssl dgst -sha512 -binary "$file" | base64 -w0)"
            if published="$(npm view "$package@$NPM_VERSION" dist.integrity 2>"$RUNNER_TEMP/npm-view.log")"; then
              :
            elif grep -q "code E404" "$RUNNER_TEMP/npm-view.log"; then
              published=""
            else
              cat "$RUNNER_TEMP/npm-view.log" >&2
              exit 1
            fi
            if [ -z "$published" ]; then
              npm publish "$file" --ignore-scripts --access "$NPM_ACCESS" --tag "$NPM_TAG"
            elif [ "$published" = "$tarball" ]; then
              echo "$package@$NPM_VERSION is already on npm with this tarball; skipping npm publish."
            else
              echo "::error::$package@$NPM_VERSION is already on npm with a different tarball. Re-run only the failed jobs so the verified packages are reused."
              exit 1
            fi
          done

  release:
    name: GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Create the tag and the GitHub release
        id: release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        # Re-running this job finishes an earlier attempt: it accepts the tag
        # only on the release commit, publishes a draft left for the tag with
        # the packages attached, and leaves a published release as it is.
        # The step records the release's page as its url output for the summary.
        run: |
          sha256sum --check SHA256SUMS
          if tagged="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>"$RUNNER_TEMP/tag.log")"; then
            if [ "$tagged" != "$RELEASE_COMMIT" ]; then
              echo "::error::Tag $RELEASE_TAG points at $tagged, not the release commit $RELEASE_COMMIT."
              exit 1
            fi
          elif ! grep -q "HTTP 404" "$RUNNER_TEMP/tag.log"; then
            cat "$RUNNER_TEMP/tag.log" >&2
            exit 1
          fi
          releases="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == env.RELEASE_TAG) | "\(.draft)\t\(.html_url)\t\([.assets[].name] | join(" "))"')"
          published_url="$(awk -F '\t' '$1 == "false" { print $2; exit }' <<<"$releases")"
          draft_url="$(awk -F '\t' '$1 == "true" { print $2; exit }' <<<"$releases")"
          flags=(--title "$RELEASE_TAG" --prerelease="$PRERELEASE")
          attached=true
          if [ -n "$published_url" ]; then
            assets="$(awk -F '\t' '$1 == "false" { print $3; exit }' <<<"$releases")"
            for file in ./*.tgz; do
              package="$(basename "$file")"
              if [[ " $assets " != *" $package "* ]]; then
                echo "::warning::The $RELEASE_TAG release is already published without $package, so the package could not be attached."
                attached=false
              fi
            done
            url="$published_url"
          else
            if [ -n "$draft_url" ]; then
              gh release upload "$RELEASE_TAG" ./*.tgz --clobber
              gh release edit "$RELEASE_TAG" --draft=false --target "$RELEASE_COMMIT" "${flags[@]}" > /dev/null
            else
              gh release create "$RELEASE_TAG" ./*.tgz --target "$RELEASE_COMMIT" --generate-notes "${flags[@]}" > /dev/null
            fi
            url="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
          fi
          {
            echo "attached=$attached"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"
      # A failed summary write leaves the release and the run as they are.
      - name: Link the release in the run summary
        if: steps.release.outputs.url != ''
        continue-on-error: true
        env:
          RELEASE_ATTACHED: ${{ steps.release.outputs.attached }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          {
            echo "### Released $RELEASE_TAG"
            echo
            if [ "$RELEASE_ATTACHED" = true ]; then
              echo "[The $RELEASE_TAG release]($RELEASE_URL) is published with the packages attached."
            else
              echo "[The $RELEASE_TAG release]($RELEASE_URL) was already published without every package, so the missing ones were not attached."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
