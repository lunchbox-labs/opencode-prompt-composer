name: Wiki
on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:
permissions: {}
concurrency:
  # Queued syncs collapse into the newest one; a running sync is never cancelled.
  group: wiki
  cancel-in-progress: false
jobs:
  sync:
    # Only main is published, so a manual run from another branch can't publish unmerged pages.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Lets the job token push to the wiki, which is its own Git repository.
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Always publish the newest main, so re-running an older run can't roll pages back.
          ref: main
          sparse-checkout: docs/wiki
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository }}.wiki
          path: .wiki
      - name: Make the wiki match docs/wiki/
        run: |
          rsync --archive --delete --exclude .git docs/wiki/ .wiki/
          sha=$(git rev-parse --short HEAD)
          cd .wiki
          git add --all
          if git diff --cached --quiet; then
            echo "The wiki already matches docs/wiki/."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "Sync from $GITHUB_REPOSITORY@$sha"
          git push --quiet origin HEAD
