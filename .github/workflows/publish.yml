name: Publish
# Run by hand on main. The run releases the version in package.json: it
# refuses a version that already has a tag or an npm release, publishes the
# verified tarball to npm and drafts a GitHub release with it attached.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lunchbox-labs-opencode-prompt-composer-publish
  cancel-in-progress: false

jobs:
  version:
    name: Release version
    if: >-
      github.repository == 'lunchbox-labs/opencode-prompt-composer' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job's summary shows on the run page once the job ends, so this short
    # job names the version within seconds of the run starting.
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require a run on main
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          if [ "$RUN_REF" != refs/heads/main ]; then
            echo "::error::Run Publish on main. This run was started on $RUN_REF."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the release version
        id: version
        shell: bash
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          version="$(jq -r .version package.json)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::package.json must hold a stable version to publish."
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing v$version from $RELEASE_COMMIT."
          {
            echo "### Release v$version"
            echo
            echo "Commit \`$RELEASE_COMMIT\` on \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Release commit checks
    if: >-
      github.repository == 'lunchbox-labs/opencode-prompt-composer' &&
      github.event_name == 'workflow_dispatch'
    # Runs after Verify, so a refused version ends the run without waiting
    # for the Check run.
    needs: [verify]
    runs-on: ubuntu-latest
    # The run can start before the commit's push-event Check run on main
    # finishes, or after it failed, so publishing waits for that run and stops
    # unless it passed.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Require a passing Check run for the release commit
        run: node scripts/release-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRED_WORKFLOWS: Check

  verify:
    name: Verify
    needs: [version]
    if: >-
      github.repository == 'lunchbox-labs/opencode-prompt-composer' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      access: ${{ steps.release.outputs.access }}
      name: ${{ steps.release.outputs.name }}
      tag: ${{ needs.version.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Keep provenance aligned with the triggering commit
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$WORKFLOW_COMMIT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate release metadata
        id: release
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: node scripts/validate-release.mjs
      - name: Refuse a version that is already released
        env:
          NPM_PACKAGE: ${{ steps.release.outputs.name }}
          NPM_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Tag $RELEASE_TAG already exists. Bump the version in package.json, merge it to main and run Publish again."
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo "::error::Could not check whether tag $RELEASE_TAG exists."
            exit 1
          fi
          if published="$(npm view "$NPM_PACKAGE@$NPM_VERSION" version 2>"$RUNNER_TEMP/npm-view.log")"; then
            if [ -n "$published" ]; then
              echo "::error::$NPM_PACKAGE@$NPM_VERSION is already on npm. To finish an earlier run of this version, re-run only its failed jobs. Otherwise bump the version in package.json, merge it to main and run Publish again."
              exit 1
            fi
          elif ! grep -q "code E404" "$RUNNER_TEMP/npm-view.log"; then
            cat "$RUNNER_TEMP/npm-view.log" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Run package tests
        run: npm run test:package
      - name: Run native tests
        run: npm run test:native
      - name: Pack the verified build
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          cd release
          sha256sum ./*.tgz > SHA256SUMS
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lunchbox-labs-opencode-prompt-composer-release
          path: release/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish npm
    needs: [checks, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lunchbox-labs-opencode-prompt-composer-release
          path: release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use a trusted-publishing-capable npm version
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - name: Publish the verified tarball with OIDC
        working-directory: release
        env:
          NPM_ACCESS: ${{ needs.verify.outputs.access }}
          NPM_PACKAGE: ${{ needs.verify.outputs.name }}
          NPM_VERSION: ${{ needs.verify.outputs.version }}
          # This repository and npm package are public.
          NPM_CONFIG_PROVENANCE: "true"
        # Re-running this job after a successful publication skips npm when the
        # registry already holds this exact tarball, and stops when it holds
        # another one.
        run: |
          sha256sum --check SHA256SUMS
          tarball="sha512-$(openssl dgst -sha512 -binary ./*.tgz | base64 -w0)"
          if published="$(npm view "$NPM_PACKAGE@$NPM_VERSION" dist.integrity 2>"$RUNNER_TEMP/npm-view.log")"; then
            :
          elif grep -q "code E404" "$RUNNER_TEMP/npm-view.log"; then
            published=""
          else
            cat "$RUNNER_TEMP/npm-view.log" >&2
            exit 1
          fi
          if [ -z "$published" ]; then
            npm publish ./*.tgz --ignore-scripts --access "$NPM_ACCESS" --tag latest
          elif [ "$published" = "$tarball" ]; then
            echo "$NPM_PACKAGE@$NPM_VERSION is already on npm with this tarball; skipping npm publish."
          else
            echo "::error::$NPM_PACKAGE@$NPM_VERSION is already on npm with a different tarball. Re-run only the failed jobs so the verified package is reused."
            exit 1
          fi

  release:
    name: Draft GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lunchbox-labs-opencode-prompt-composer-release
          path: release
      # Only maintainers may create v* tags, so the draft names the tag and the
      # release commit, and GitHub creates the tag on that commit when a
      # maintainer publishes the draft.
      - name: Create or update the draft release
        id: draft
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        # Re-running this job uploads the package to the existing draft again.
        # A published release is immutable, so it is left as it is.
        # The step records the release's page as its url output for the summary.
        run: |
          sha256sum --check SHA256SUMS
          releases="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == env.RELEASE_TAG) | "\(.draft)\t\(.html_url)"')"
          draft_url="$(awk -F '\t' '$1 == "true" { print $2; exit }' <<<"$releases")"
          if [ -n "$draft_url" ]; then
            gh release upload "$RELEASE_TAG" ./*.tgz --clobber
            url="$draft_url"
            state=draft
          elif [ -n "$releases" ]; then
            echo "::warning::The $RELEASE_TAG release is already published, so the package could not be attached."
            url="$(awk -F '\t' 'NR == 1 { print $2 }' <<<"$releases")"
            state=published
          else
            created="$(gh release create "$RELEASE_TAG" ./*.tgz --draft --target "$RELEASE_COMMIT" --generate-notes --title "$RELEASE_TAG")"
            url="$(grep -m 1 '^https://' <<<"$created" || true)"
            state=draft
          fi
          {
            echo "state=$state"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"
      # A failed summary write leaves the release and the run as they are.
      - name: Link the release in the run summary
        if: steps.draft.outputs.url != ''
        continue-on-error: true
        env:
          RELEASE_STATE: ${{ steps.draft.outputs.state }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_URL: ${{ steps.draft.outputs.url }}
        run: |
          {
            if [ "$RELEASE_STATE" = draft ]; then
              echo "### Draft release $RELEASE_TAG"
              echo
              echo "[Review and publish the draft release]($RELEASE_URL). Publishing it creates the \`$RELEASE_TAG\` tag."
            else
              echo "### Release $RELEASE_TAG"
              echo
              echo "[The $RELEASE_TAG release]($RELEASE_URL) was already published, so the package was not attached."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
