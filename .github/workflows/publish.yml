name: Publish
on:
  push:
    # Stable version tags only; prerelease tags do not publish.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: lunchbox-labs-opencode-prompt-composer-publish
  cancel-in-progress: false

jobs:
  checks:
    name: Release commit checks
    if: >-
      github.repository == 'lunchbox-labs/opencode-prompt-composer' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      !github.event.deleted
    runs-on: ubuntu-latest
    # A version tag can be pushed before the tagged commit's push-event Check run
    # on main finishes, or after it failed, so publishing waits for that run and
    # stops unless it passed.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      # A tagged commit that is not on main never gets a push-event Check run,
      # so stop at once instead of waiting for one.
      - name: Require a commit already on main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Require a passing Check run for the release commit
        run: node scripts/release-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRED_WORKFLOWS: Check

  verify:
    name: Verify
    if: >-
      github.repository == 'lunchbox-labs/opencode-prompt-composer' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    outputs:
      access: ${{ steps.release.outputs.access }}
      name: ${{ steps.release.outputs.name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Require a stable version tag
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit already on main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Keep provenance aligned with the triggering commit
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$WORKFLOW_COMMIT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate release metadata
        id: release
        run: node scripts/validate-release.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Run package tests
        run: npm run test:package
      - name: Run native tests
        run: npm run test:native
      - name: Pack the verified build
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          cd release
          sha256sum ./*.tgz > SHA256SUMS
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lunchbox-labs-opencode-prompt-composer-release
          path: release/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish npm
    needs: [checks, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lunchbox-labs-opencode-prompt-composer-release
          path: release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use a trusted-publishing-capable npm version
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - name: Publish the verified tarball with OIDC
        working-directory: release
        env:
          NPM_ACCESS: ${{ needs.verify.outputs.access }}
          NPM_PACKAGE: ${{ needs.verify.outputs.name }}
          NPM_VERSION: ${{ needs.verify.outputs.version }}
          # This repository and npm package are public.
          NPM_CONFIG_PROVENANCE: "true"
        # A re-run after a successful publication skips npm when the registry
        # already holds this exact tarball, and stops when it holds another one.
        run: |
          sha256sum --check SHA256SUMS
          tarball="sha512-$(openssl dgst -sha512 -binary ./*.tgz | base64 -w0)"
          if published="$(npm view "$NPM_PACKAGE@$NPM_VERSION" dist.integrity 2>"$RUNNER_TEMP/npm-view.log")"; then
            :
          elif grep -q "code E404" "$RUNNER_TEMP/npm-view.log"; then
            published=""
          else
            cat "$RUNNER_TEMP/npm-view.log" >&2
            exit 1
          fi
          if [ -z "$published" ]; then
            npm publish ./*.tgz --ignore-scripts --access "$NPM_ACCESS" --tag latest
          elif [ "$published" = "$tarball" ]; then
            echo "$NPM_PACKAGE@$NPM_VERSION is already on npm with this tarball; skipping npm publish."
          else
            echo "::error::$NPM_PACKAGE@$NPM_VERSION is already on npm with a different tarball. Re-run only the failed jobs so the verified package is reused."
            exit 1
          fi

  release:
    name: Draft GitHub release
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lunchbox-labs-opencode-prompt-composer-release
          path: release
      - name: Create or update the draft release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        # A re-run uploads the package to the existing draft again. A published
        # release is immutable, so it is left as it is.
        run: |
          sha256sum --check SHA256SUMS
          drafts="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .draft')"
          if grep -qx true <<<"$drafts"; then
            gh release upload "$RELEASE_TAG" ./*.tgz --clobber
          elif [ -n "$drafts" ]; then
            echo "::warning::The $RELEASE_TAG release is already published, so the package could not be attached."
          else
            gh release create "$RELEASE_TAG" ./*.tgz --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
