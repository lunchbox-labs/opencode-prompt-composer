name: Publish @lunchbox-labs/opencode-prompt-composer
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lunchbox-labs-opencode-prompt-composer-publish
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'lunchbox-labs/opencode-prompt-composer' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_COMMIT: ${{ github.sha }}
    outputs:
      access: ${{ steps.release.outputs.access }}
      name: ${{ steps.release.outputs.name }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate the intended source and release metadata
        id: release
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          export RELEASE_TAG="v$(node -p "require('./package.json').version")"
          node scripts/validate-release.mjs
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Create or reuse the exact tag and draft
        env:
          NPM_PACKAGE_NAME: ${{ steps.release.outputs.name }}
          NPM_PACKAGE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-lifecycle.mjs prepare

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit already on main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Keep provenance aligned with the triggering commit
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$WORKFLOW_COMMIT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release metadata
        id: release
        run: node scripts/validate-release.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run test:package
      - run: npm run test:native
      - name: Pack the verified build
        run: |
          mkdir release release-repack
          npm pack --ignore-scripts --pack-destination release
          npm pack --ignore-scripts --pack-destination release-repack
          cmp release/*.tgz release-repack/*.tgz
          cd release
          sha256sum ./*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lunchbox-labs-opencode-prompt-composer-release
          path: release/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: lunchbox-labs-opencode-prompt-composer-release
          path: release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use a trusted-publishing-capable npm version
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - name: Publish npm or verify an identical existing version
        env:
          NPM_PACKAGE_NAME: ${{ needs.prepare.outputs.name }}
          NPM_PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          NPM_ACCESS: ${{ needs.prepare.outputs.access }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          node scripts/release-lifecycle.mjs npm

  finish:
    needs: [prepare, verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: lunchbox-labs-opencode-prompt-composer-release
          path: release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify npm bytes, attach the archive and publish the draft
        env:
          NPM_PACKAGE_NAME: ${{ needs.prepare.outputs.name }}
          NPM_PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          node scripts/release-lifecycle.mjs finish
